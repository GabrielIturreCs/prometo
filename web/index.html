    <style>
      /* splash: painted before any JS loads, removed after the first render */
      #splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .35s ease; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash img { width: 76px; height: 102px; animation: plant .7s cubic-bezier(.2,.9,.3,1.2) both; }
      #splash span { font: 800 34px/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -1.4px; color: #0B0E12; animation: rise .6s .15s ease both; }
      @keyframes plant { from { transform: translateY(18px) scale(.86); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes rise { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/glyph.svg" alt="" /><span>prometo</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
