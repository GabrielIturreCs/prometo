[vars]
CHAIN = "testnet"
POOL_ADDRESS = "0x0000000000000000000000000000000000000000"
# Secrets (wrangler secret put): RELAYER_KEY, AI_API_KEY, AI_BASE_URL, AI_MODEL, RPC_URL

[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_ID"   # wrangler kv namespace create DATA
